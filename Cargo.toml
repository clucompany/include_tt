[package]
name = "include_tt"
version = "1.1.1"
edition = "2024"
authors = ["Denis Kotlyarov (Денис Котляров) <denis2005991@gmail.com>"]
repository = "https://github.com/clucompany/include_tt.git"
license = "MIT OR Apache-2.0"
readme = "README.md"

description = "Macros for ultra-flexible injection of token trees, literals, or binary data into Rust code from external files during compilation."
keywords = [
	"procedural-macros",
	"macro",
	"syntax-injection",
	"tt-injection",
	"clucompany"
]

categories = [
	"development-tools",
	"development-tools::build-utils",
	"parsing"
]

[features]
default = [ ]
escape_symbol = []

[lib]
proc-macro = true

[dependencies]
quote = "1.0.45"
proc-macro2 = "1.0.106"

[dependencies.syn]
version = "2.0.117"
default-features = false
features = ["parsing"]
